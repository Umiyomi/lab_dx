[project]
name = "aquarium-and-romance"
version = "0.1.0"
description = "水族館体験研究のモックプロジェクト（ラボDX標準リポジトリ構成の実証用）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
